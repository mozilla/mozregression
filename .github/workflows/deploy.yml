name: Build and upload to TestPyPI and PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish-to-pypi:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `setuptools_scm` needs the tag history to derive the version.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Build
        run: |
          uv build
          ls -alh dist/
      - name: Upload to TestPyPI
        run: uvx twine upload -r testpypi dist/* --verbose --username __token__ --password ${TESTPYPI_TOKEN}
      - name: Upload to PyPI
        run: uvx twine upload dist/* --verbose --username __token__ --password ${PYPI_TOKEN}
