# pyproject.toml
[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=3.4"]

[tool.setuptools_scm]
write_to = "mozregression/version.py"

[tool.black]
line-length = 100
# excludes handled in setup.cfg, since it's called via flake8

[tool.isort]
line_length = 100
skip_glob = "**/gui/mozregui/ui/*"
default_section = "THIRDPARTY"
known_first_party = "mozregression,mozregui"
known_third_party = "taskcluster"
# For compatibility with black:
multi_line_output = 3
include_trailing_comma = "True"
force_grid_wrap = 0
use_parentheses = "True"

[project]
name = "mozregression"
dynamic = ["version"]
description = "Regression range finder for Mozilla nightly builds"
readme = "README.md"
dependencies = [
  "glean_sdk>=60.3.0",
  "beautifulsoup4>=4.7.1",
  "colorama>=0.4.1",
  "configobj>=5.0.6",
  "distro>=1.8.0",
  "importlib_resources>= 5.10",
  "mozdevice>=4.1.0,<5",
  "mozfile>=2.0.0",
  "mozinfo>=1.1.0",
  "mozinstall>=2.0.0",
  "mozlog>=4.0",
  "mozprocess>=1.3.1",
  "mozprofile>=2.2.0",
  "mozrunner>=8.0.2",
  "mozversion>=2.1.0",
  "redo>=2.0.2",
  "requests>=2.21.0",
  "taskcluster>=6.0.0",
]
requires-python = ">= 3.9"
license = {text = "MPL 2.0"}
authors = [
  {name = "Mozilla Automation and Tools Team", email = "tools@lists.mozilla.org"}
]
classifiers = [
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
# Make sure sure to update requirements/gui.in
gui = [
  "pyside6>=6.9.0"
]

[project.scripts]
mozregression = "mozregression.main:main"

[project.gui-scripts]
mozregui = "gui.mozregui.main:main"
mozregression-gui = "gui.mozregui.main:main"

[dependency-groups]
# Make sure sure to update requirements/dev.in
dev = [
  "coverage",
  "coveralls",
  "mock",
  "pytest",
  "pytest-mock",
  {include-group = "lint"},
]
# Make sure sure to update requirements/gui-dev.in
dev-gui = [
  "pytest-qt",
  {include-group = "dev"},
]
# Make sure sure to update requirements/linters.in.
lint = [
  "flake8-black",
  "flake8>=6.0.0; python_version >= '3.8'",
  "glean-parser",
  "isort",
  "mccabe",
  "pyflakes",
]

[tool.setuptools]
packages = [
  "mozregression",
  "mozregui",
  "resources_rc",
]
platforms = ["Any"]

[tool.setuptools.package-dir]
mozregui= "gui/mozregui"
# XXX: this gets built by gui/build.py, so we can't pre-install it
resources_rc = "gui/resources_rc"

[tool.setuptools.package-data]
mozregression = ["*.yaml"]
