# pyproject.toml
[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=3.4"]

[tool.setuptools_scm]
write_to = "mozregression/version.py"

[tool.black]
line-length = 100
# excludes handled in setup.cfg, since it's called via flake8

[tool.isort]
line_length = 100
skip_glob = "**/gui/mozregui/ui/*"
default_section = "THIRDPARTY"
known_first_party = "mozregression,mozregui"
known_third_party = "taskcluster"
# For compatibility with black:
multi_line_output = 3
include_trailing_comma = "True"
force_grid_wrap = 0
use_parentheses = "True"

[project]
name = "mozregression"
dynamic = ["version"]
description = "Regression range finder for Mozilla nightly builds"
readme = "README.md"
dependencies = [
  "beautifulsoup4>=4.7.1",
  "charset-normalizer<3",
  "colorama>=0.4.1",
  "configobj>=5.0.6",
  "distro>=1.8.0",
  # `glean-sdk` is held at 60.3.0 on Linux/Windows because newer releases lack
  # wheels for some of our supported Pythons; on darwin it is URL-pinned to a
  # `universal2` wheel via `[tool.uv.sources]` below.
  "glean-sdk==60.3.0; sys_platform != 'darwin'",
  "glean-sdk==65.0.1; sys_platform == 'darwin'",
  "importlib-metadata==8.5.0",
  "importlib_resources>=5.10",
  # `jsonschema` 4.18+ depends on `rpds-py`, which has no `universal2` wheels;
  # PyInstaller's `target_arch="universal2"` build would fail. The clamp below
  # keeps `rpds-py` out of the darwin closure.
  "jsonschema; sys_platform != 'darwin'",
  "jsonschema==4.17.3; sys_platform == 'darwin'",
  "mozdevice>=4.1.0,<5",
  "mozfile>=2.0.0",
  "mozinfo>=1.1.0",
  "mozinstall>=2.0.0",
  # `mozlog` 8.1+ pulls in `mozsystemmonitor` → `psutil`, which has no
  # `universal2` wheel and breaks PyInstaller's `target_arch="universal2"`
  # bundle. Pin under 8.1 until we have a universal2 story for `psutil`.
  "mozlog>=4.0,<8.1",
  "mozprocess>=1.3.1",
  "mozprofile>=2.2.0",
  "mozrunner>=8.0.2",
  "mozversion>=2.1.0",
  "pyyaml==6.*",
  "redo>=2.0.2",
  "requests>=2.21.0",
  "taskcluster>=6.0.0",
  # Native-extension transitive deps pinned on darwin so the URL pins in
  # `[tool.uv.sources]` resolve to a matching version. On other platforms the
  # resolver is free to pick the latest compatible version.
  "aiohttp==3.12.15; sys_platform == 'darwin'",
  "frozenlist==1.7.0; sys_platform == 'darwin'",
  "markupsafe==3.0.2; sys_platform == 'darwin'",
  "multidict==6.6.4; sys_platform == 'darwin'",
  "propcache==0.3.2; sys_platform == 'darwin'",
  "yarl==1.20.1; sys_platform == 'darwin'",
]
requires-python = ">= 3.9"
license = {text = "MPL 2.0"}
authors = [
  {name = "Mozilla Automation and Tools Team", email = "tools@lists.mozilla.org"}
]
classifiers = [
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
mozregression = "mozregression.main:main"

[tool.setuptools]
packages = ["mozregression"]
platforms = ["Any"]

[tool.setuptools.package-data]
mozregression = ["*.yaml"]

[dependency-groups]
dev = [
  "coverage",
  "coveralls",
  "mock",
  "pytest",
  "pytest-mock",
]
gui = [
  "PySide6==6.9.*",
]
gui-dev = [
  "pytest-qt",
]
linters = [
  # Pinned to match the version the existing codebase was formatted with.
  # Black's "stable style" only holds across major versions (25.x -> 26.x),
  # so a looser pin like `==25.*` would still allow formatting drift.
  "black==25.1.0",
  "flake8>=6.0.0",
  "flake8-black",
  "glean-parser",
  "isort",
  "mccabe",
  "pyflakes",
]
build = [
  "PyInstaller==6.15.*",
  "dmgbuild==1.*",
  "setuptools_scm==8.*",
]

[tool.uv]
# Force the resolver to pick versions whose wheels cover both Mac arches, so
# PyInstaller's `target_arch="universal2"` bundle (see `gui/gui.spec`) can find
# `universal2` wheels for every native-extension dependency.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Replaces the `--no-binary` directives that lived in the old `.in` files.
no-binary-package = [
  "coverage",
  "mypy-extensions",
  "pyyaml",
]

[tool.uv.sources]
# `universal2` wheel pins for the macOS PyInstaller bundle. `pip`/`uv` would
# otherwise prefer the more-specific `arm64`/`x86_64` wheels at install time,
# which would break PyInstaller's `target_arch="universal2"` check. The URLs
# must match the versions pinned in `[project.dependencies]` above.
aiohttp = [
